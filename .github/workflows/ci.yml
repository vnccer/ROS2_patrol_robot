name: Humble build and navigation acceptance
on: [push, pull_request, workflow_dispatch]
jobs:
  humble:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Install and build
        run: bash scripts/setup_ubuntu.sh
      - name: Real Nav2 acceptance (headless)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          mkdir -p test_results
          bash scripts/run.sh rviz:=false panel:=false > test_results/launch.log 2>&1 &
          PATROL_LAUNCH_PID=$!
          trap 'kill -INT "$PATROL_LAUNCH_PID"; wait "$PATROL_LAUNCH_PID" || true' EXIT
          python3 tools/ros_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patrol-test-results
          path: |
            test_results/
            log/
